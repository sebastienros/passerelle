name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'sebastienros/passerelle'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          core_identifier='(0|[1-9][0-9]*)'
          prerelease_identifier='(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
          release_pattern="^v${core_identifier}\.${core_identifier}\.${core_identifier}(-${prerelease_identifier}(\.${prerelease_identifier})*)?$"
          if [[ ! "$GITHUB_REF_NAME" =~ $release_pattern ]]; then
            echo "::error::Release tags must be semantic versions such as v1.2.3 or v1.2.3-preview.1."
            exit 1
          fi

          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::Release tags must point to a commit contained in origin/main."
            exit 1
          fi

          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Passerelle.slnx -p:Configuration=Release -p:Version="$RELEASE_VERSION" -p:ContinuousIntegrationBuild=true
      - name: Build
        run: dotnet build Passerelle.slnx --configuration Release --no-restore -p:Version="$RELEASE_VERSION" -p:ContinuousIntegrationBuild=true
      - name: Test
        run: dotnet test Passerelle.slnx --configuration Release --no-build
      - name: Pack
        run: dotnet pack src/Passerelle/Passerelle.csproj --configuration Release --no-build --output artifacts -p:Version="$RELEASE_VERSION" -p:ContinuousIntegrationBuild=true
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: sebastienros
      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
