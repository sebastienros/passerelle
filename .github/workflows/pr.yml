name: PR Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Passerelle.slnx -p:Configuration=Release -p:ContinuousIntegrationBuild=true
      - name: Build
        run: dotnet build Passerelle.slnx --configuration Release --no-restore -p:ContinuousIntegrationBuild=true
      - name: Test
        run: dotnet test Passerelle.slnx --configuration Release --no-build
      - name: Pack
        if: runner.os == 'Linux'
        run: dotnet pack src/Passerelle/Passerelle.csproj --configuration Release --no-build --output artifacts -p:ContinuousIntegrationBuild=true
