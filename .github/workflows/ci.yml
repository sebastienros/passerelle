name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - run: dotnet build Passerelle.slnx -c Release
      - run: dotnet test Passerelle.slnx -c Release --no-build
      - run: dotnet pack src/Passerelle -c Release --no-build -o artifacts
